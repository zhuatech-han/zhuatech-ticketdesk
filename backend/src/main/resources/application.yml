spring:
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: ${DATABASE_URL:jdbc:mariadb://mysql:3306/zhuatech_ticketdesk?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&allowLocalInfile=false&sslMode=trust}
    username: ${DATABASE_USER:ticketdesk}
    password: ${DATABASE_PASSWORD}
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    database-platform: cn.zhuatech.ticketdesk.MySqlJdbcDialect
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: [classpath:db/migration]
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      enabled: true
server:
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 30m
      cookie:
        name: TICKETDESK_SESSION
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
management:
  health:
    mail:
      enabled: ${MAIL_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: [readinessState, db]
  endpoints:
    web:
      exposure:
        include: health
ticketdesk:
  admin-username: ${ADMIN_USERNAME:admin}
  admin-password: ${ADMIN_PASSWORD}
  signing-key: ${TICKET_SIGNING_KEY}
  payment-mode: ${PAYMENT_MODE:DEMO}
  public-url: ${PUBLIC_URL:http://localhost:8160}
  scheduler-enabled: ${SCHEDULER_ENABLED:true}
  stripe-secret-key: ${STRIPE_SECRET_KEY:}
  stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  mail-enabled: ${MAIL_ENABLED:false}
  mail-from: ${MAIL_FROM:}
# Hibernate 的连接描述可能包含驱动展开的连接参数；不得输出凭证或业务约束原值。
logging:
  level:
    org.hibernate.orm.connections.pooling: WARN
    org.hibernate.orm.jdbc.error: OFF
